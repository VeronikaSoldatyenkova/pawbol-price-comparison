<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}Price Comparison{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/results-enhancements.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><span>€</span></div>
        <div>
          <h1>Price Comparison</h1>
          <p>Compare your current prices with supplier pricelists in one place.</p>
        </div>
      </div>
      <div class="status-pill"><span class="status-dot"></span>Stable mode</div>
    </header>
    {% block content %}{% endblock %}
    <footer class="app-footer">Price Comparison · Excel files are processed only for the active comparison workspace.</footer>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
