<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Price List Comparison{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div>
        <h1>📊 Price List Comparison</h1>
        <p>Compare current prices with one or many supplier price lists.</p>
      </div>
      <div class="status-pill">HTTP app · no Streamlit reruns</div>
    </header>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
